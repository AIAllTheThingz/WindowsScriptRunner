name: Public-AI-Governance v0.10.0 Adoption Pilot

on:
  push:
    branches:
      - adoption/public-ai-governance-v0.10.0

permissions:
  contents: write

jobs:
  adopt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out downstream project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: adoption/public-ai-governance-v0.10.0
          fetch-depth: 0
          path: downstream

      - name: Check out published standards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AIAllTheThingz/Public-AI-Governance
          ref: v0.10.0
          path: standards

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Install standards tooling dependencies
        working-directory: standards
        run: python -m pip install --require-hashes -r tools/validate-schemas/requirements.lock

      - name: Generate manifest and standards composition
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/downstream/docs/public-ai-governance"
          mkdir -p "$OUT"
          python standards/tools/generate-manifest/generate_manifest.py --root standards --name WindowsScriptRunner --profile INTERNAL_AUTOMATION --secondary-profile WEB_APPLICATION --language csharp --language dotnet --language powershell --framework aspnet-core --operating-system windows-server --include-profile-required --manifest-output "$OUT/project-manifest.json" --format json > "$OUT/generate-manifest-result.json"
          python standards/tools/compose-agents/compose_agents.py --root standards --manifest "$OUT/project-manifest.json" --output-dir "$OUT/standards-bundle" --no-copy-sources --format json > "$OUT/compose-result.json"

      - name: Capture downstream validation evidence
        working-directory: downstream
        shell: bash
        run: |
          set +e
          mkdir -p docs/public-ai-governance
          dotnet --info > docs/public-ai-governance/dotnet-info.txt 2>&1
          DOTNET_INFO_RC=$?
          dotnet tool restore > docs/public-ai-governance/dotnet-tool-restore.txt 2>&1
          TOOL_RESTORE_RC=$?
          dotnet restore > docs/public-ai-governance/dotnet-restore.txt 2>&1
          RESTORE_RC=$?
          if [ "$RESTORE_RC" -eq 0 ]; then dotnet build --configuration Release --no-restore > docs/public-ai-governance/dotnet-build.txt 2>&1; BUILD_RC=$?; else BUILD_RC=125; printf 'NotRun: restore did not pass; build was not attempted.\n' > docs/public-ai-governance/dotnet-build.txt; fi
          if [ "$BUILD_RC" -eq 0 ]; then dotnet test --configuration Release --no-build > docs/public-ai-governance/dotnet-test.txt 2>&1; TEST_RC=$?; else TEST_RC=125; printf 'NotRun: build did not pass; tests were not attempted.\n' > docs/public-ai-governance/dotnet-test.txt; fi
          if [ "$TOOL_RESTORE_RC" -eq 0 ]; then dotnet format --verify-no-changes > docs/public-ai-governance/dotnet-format.txt 2>&1; FORMAT_RC=$?; else FORMAT_RC=125; printf 'NotRun: dotnet tool restore did not pass; format verification was not attempted.\n' > docs/public-ai-governance/dotnet-format.txt; fi
          if command -v pwsh >/dev/null 2>&1; then pwsh -NoProfile -Command '$errs=@(); Get-ChildItem automation,src,tests,deployment -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in ".ps1", ".psm1" } | ForEach-Object { $t=$null; $e=$null; [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$t,[ref]$e); if($e){$errs += $e} }; if($errs.Count){$errs | Out-String | Write-Error; exit 1}; "PowerShell parse: Passed"' > docs/public-ai-governance/powershell-parse.txt 2>&1; PS_RC=$?; else PS_RC=125; printf 'Blocked: pwsh is not available on the validation runner.\n' > docs/public-ai-governance/powershell-parse.txt; fi
          printf 'DOTNET_INFO_RC=%s\nTOOL_RESTORE_RC=%s\nRESTORE_RC=%s\nBUILD_RC=%s\nTEST_RC=%s\nFORMAT_RC=%s\nPS_RC=%s\n' "$DOTNET_INFO_RC" "$TOOL_RESTORE_RC" "$RESTORE_RC" "$BUILD_RC" "$TEST_RC" "$FORMAT_RC" "$PS_RC" > docs/public-ai-governance/validation-status.env
          exit 0

      - name: Commit machine evidence and remove one-shot workflow
        working-directory: downstream
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/public-ai-governance-pilot.yml
          git config user.name "AIAllTheThingz"
          git config user.email "aiallthethingz@gmail.com"
          git add docs/public-ai-governance .github/workflows/public-ai-governance-pilot.yml
          git commit -m "test: capture Public-AI-Governance adoption evidence"
          git push origin HEAD:adoption/public-ai-governance-v0.10.0
